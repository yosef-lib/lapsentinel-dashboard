<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LapSentinel Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar-active { background-color: #4a4a4a; border-left: 4px solid #fff; }
    </style>
</head>
<body class="bg-gray-100 flex font-sans text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#343a40] text-gray-300 min-h-screen flex flex-col shadow-xl fixed">
        <!-- Brand -->
        <div class="h-16 flex items-center px-6 bg-[#23272b] text-white font-bold text-lg tracking-wide border-b border-gray-700">
            <i class="fas fa-shield-alt mr-3 text-blue-400"></i>
            LapSentinel
        </div>
        
        <!-- User Info -->
        <div class="p-6 border-b border-gray-700 flex items-center">
            <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xl mr-3">
                {{ session.get('name', 'A')[0] }}
            </div>
            <div>
                <p class="text-sm font-semibold text-white">{{ session.get('name', 'Admin') }}</p>
                <p class="text-xs text-gray-400"><i class="fas fa-circle text-green-400 text-[8px] mr-1"></i> Online</p>
            </div>
        </div>

        <!-- Menu -->
        <nav class="flex-1 py-4">
            <ul class="space-y-1">
                <li>
                    <a href="{{ url_for('dashboard') }}" class="flex items-center px-6 py-3 hover:bg-gray-700 hover:text-white transition {% if request.endpoint == 'dashboard' %}sidebar-active text-white{% endif %}">
                        <i class="fas fa-home w-5 mr-3"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('device_list') }}" class="flex items-center px-6 py-3 hover:bg-gray-700 hover:text-white transition {% if request.endpoint == 'device_list' %}sidebar-active text-white{% endif %}">
                        <i class="fas fa-laptop w-5 mr-3"></i> Daftar Perangkat
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-file-alt w-5 mr-3"></i> Laporan (Excel)
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-cog w-5 mr-3"></i> Pengaturan
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Logout -->
        <div class="p-4 border-t border-gray-700">
            <a href="{{ url_for('logout') }}" class="flex items-center px-4 py-2 text-red-400 hover:bg-gray-700 hover:text-red-300 rounded transition">
                <i class="fas fa-sign-out-alt w-5 mr-2"></i> Keluar
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        <!-- Top Nav -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 border-b border-gray-200">
            <div class="text-gray-500">
                <i class="fas fa-bars cursor-pointer hover:text-gray-700"></i>
            </div>
            <div class="text-sm font-medium text-gray-600 flex items-center gap-4">
                <i class="fas fa-clock text-gray-400"></i> WAKTU SAAT INI: 
                <span class="font-bold text-gray-800" id="clock">Memuat...</span>
            </div>
        </header>

        <!-- Page Content -->
        <div class="p-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // Simple live clock for the topnav
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
